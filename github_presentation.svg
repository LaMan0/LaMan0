<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      .terminal-font { font-family: 'Fira Code', 'Consolas', 'Monaco', monospace; font-size: 14px; }
      .prompt { fill: #7ee787; font-weight: bold; }
      .cmd { fill: #e6edf3; font-weight: bold; }
      .output { fill: #c9d1d9; }
      .highlight { fill: #7ee787; font-weight: bold; }
      .bullet { fill: #ffa657; }
    </style>
  </defs>

  <!-- Fond de la fenêtre du terminal -->
  <rect width="800" height="300" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  
  <!-- Barre d'en-tête (style macOS) -->
  <path d="M0 10C0 4.47715 4.47715 0 10 0H790C795.523 0 800 4.47715 800 10V30H0V10Z" fill="#161b22"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="400" y="20" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">laman0@github: ~/mmi</text>

  <!-- Contenu du terminal -->
  <g class="terminal-font" transform="translate(25, 60)">
    <!-- Ligne 1 : commande whoami -->
    <text y="0">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">who_am_i</tspan>
    </text>
    
    <!-- Résultat whoami -->
    <text y="28" class="output">
      Étudiant en <tspan class="highlight" font-weight="bold">MMI</tspan> — Métiers du Multimédia et de l'Internet
    </text>

    <!-- Ligne 2 : commande ls competences/ -->
    <text y="70">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">Competences/</tspan>
    </text>

    <!-- Résultats compétences -->
    <text y="98" class="output">
      <tspan class="bullet">❯ </tspan>Développement Web (Frontend &amp; Backend)
    </text>
    <text y="122" class="output">
      <tspan class="bullet">❯ </tspan>UI/UX Design &amp; Maquetage (Figma)
    </text>
    <text y="146" class="output">
      <tspan class="bullet">❯ </tspan>Création Multimédia &amp; Audiovisuel
    </text>

    <!-- Ligne finale avec curseur clignotant -->
    <text y="190">
      <tspan class="prompt">$ </tspan>
      <rect x="18" y="-11" width="8" height="15" fill="#7ee787">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </text>
  </g>
</svg>
