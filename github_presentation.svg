<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Terminal affichant : étudiant en MMI">
  <title>étudiant en MMI</title>
  <style>
    .mono { font-family: ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    /*
      Cycle de 12,5 s : frappe (0 -> 6,3 s) / pause (6,3 -> 7,8 s) / effacement (7,8 -> 10,05 s) / blanc (10,05 -> 12,5 s).
      Effacement continu : 0,45 s par ligne, enchaînées sans pause, de la ligne 5 vers la ligne 1.

      Deux invites "$" :
      - celle de la ligne 1 est le prompt de la commande : elle ne fait pas partie du texte masqué
        (le masque de la ligne 1 commence après elle), donc elle reste affichée en permanence.
      - celle du bas n'apparaît que lorsque tout est affiché (pendant la pause) et disparaît dès
        que l'effacement commence.

      Le curseur (un par ligne, plus celui du prompt du bas) se tient toujours exactement sur le bord
      du masque de sa ligne, c'est-à-dire à la fin du texte visible : il avance avec la frappe,
      recule avec l'effacement, et se pose juste après le "$" de la ligne 1 quand rien n'est affiché.

      Trois familles d'éléments par ligne :
      - cover (r1..r5) : masque. scaleX(1) = ligne cachée, scaleX(0) = ligne visible.
            frappe = scaleX 1 -> 0 (le masque se rétracte, le texte apparaît de gauche à droite)
            effacement = scaleX 0 -> 1 (le masque revient depuis la droite, comme un retour arrière)
      - cursor (m1..m5 + visibilité p1..p5) : curseur sur le bord du masque, même chronologie et
            mêmes paliers que lui, en translation.
      - tail (b1..b5) : rectangle de sécurité au-delà du texte, opaque seulement pendant
            l'effacement de la ligne, pour rattraper une police monospace plus large.
    */
    .cover { fill:#0d1117; transform-box: fill-box; transform-origin: 100% 50%; }
    .tail  { fill:#0d1117; }
    .cur   { fill:#7ee787; }

    .c1 { animation: r1 12.5s infinite; }
    .c2 { animation: r2 12.5s infinite; }
    .c3 { animation: r3 12.5s infinite; }
    .c4 { animation: r4 12.5s infinite; }
    .c5 { animation: r5 12.5s infinite; }
    .k1 { animation: m1 12.5s infinite, p1 12.5s infinite; }
    .k2 { animation: m2 12.5s infinite, p2 12.5s infinite; }
    .k3 { animation: m3 12.5s infinite, p3 12.5s infinite; }
    .k4 { animation: m4 12.5s infinite, p4 12.5s infinite; }
    .k5 { animation: m5 12.5s infinite, p5 12.5s infinite; }
    .t1 { animation: b1 12.5s infinite; }
    .t2 { animation: b2 12.5s infinite; }
    .t3 { animation: b3 12.5s infinite; }
    .t4 { animation: b4 12.5s infinite; }
    .t5 { animation: b5 12.5s infinite; }
    /* prompt du bas : visible seulement pendant la pause, quand tout est affiché */
    .shell { animation: shell 12.5s infinite; }
    .cursor { animation: blink 1.1s infinite; }

    /* masques : frappe -> pause -> effacement -> ligne cachée jusqu'au prochain cycle */
    @keyframes r1 { 0%,2.24%   { transform: scaleX(1); animation-timing-function: steps(6);  } 6.72%,76.80%  { transform: scaleX(0); animation-timing-function: steps(6);  } 80.40%,100% { transform: scaleX(1); } }
    @keyframes r2 { 0%,10.08%  { transform: scaleX(1); animation-timing-function: steps(58); } 17.92%,73.20% { transform: scaleX(0); animation-timing-function: steps(58); } 76.80%,100% { transform: scaleX(1); } }
    @keyframes r3 { 0%,21.28%  { transform: scaleX(1); animation-timing-function: steps(19); } 26.88%,69.60% { transform: scaleX(0); animation-timing-function: steps(19); } 73.20%,100% { transform: scaleX(1); } }
    @keyframes r4 { 0%,30.24%  { transform: scaleX(1); animation-timing-function: steps(53); } 38.08%,66.00% { transform: scaleX(0); animation-timing-function: steps(53); } 69.60%,100% { transform: scaleX(1); } }
    @keyframes r5 { 0%,41.44%  { transform: scaleX(1); animation-timing-function: steps(66); } 50.40%,62.40% { transform: scaleX(0); animation-timing-function: steps(66); } 66.00%,100% { transform: scaleX(1); } }

    /* curseurs : même chronologie et mêmes paliers que les masques, en translation */
    @keyframes m1 { 0%,2.24%   { transform: translateX(0);    animation-timing-function: steps(6);  } 6.72%,76.80%  { transform: translateX(56px);  animation-timing-function: steps(6);  } 80.40%,100% { transform: translateX(0); } }
    @keyframes m2 { 0%,10.08%  { transform: translateX(0);    animation-timing-function: steps(58); } 17.92%,73.20% { transform: translateX(488px); animation-timing-function: steps(58); } 76.80%,100% { transform: translateX(0); } }
    @keyframes m3 { 0%,21.28%  { transform: translateX(0);    animation-timing-function: steps(19); } 26.88%,69.60% { transform: translateX(154px); animation-timing-function: steps(19); } 73.20%,100% { transform: translateX(0); } }
    @keyframes m4 { 0%,30.24%  { transform: translateX(0);    animation-timing-function: steps(53); } 38.08%,66.00% { transform: translateX(452px); animation-timing-function: steps(53); } 69.60%,100% { transform: translateX(0); } }
    @keyframes m5 { 0%,41.44%  { transform: translateX(0);    animation-timing-function: steps(66); } 50.40%,62.40% { transform: translateX(593px); animation-timing-function: steps(66); } 66.00%,100% { transform: translateX(0); } }

    /*
      Visibilité des curseurs de ligne. Le curseur de la ligne 1 reste en place de la fin de sa
      frappe jusqu'au redémarrage du cycle : écran vide = curseur posé après le "$" de la ligne 1.
    */
    @keyframes p1 { 0%,6.72%      { opacity:1; } 6.73%,76.79%   { opacity:0; } 76.80%,100% { opacity:1; } }
    @keyframes p2 { 0%,6.72%      { opacity:0; } 6.73%,17.92%   { opacity:1; } 17.93%,73.19% { opacity:0; } 73.20%,76.80% { opacity:1; } 76.81%,100% { opacity:0; } }
    @keyframes p3 { 0%,17.92%     { opacity:0; } 17.93%,26.88%  { opacity:1; } 26.89%,69.59% { opacity:0; } 69.60%,73.20% { opacity:1; } 73.21%,100% { opacity:0; } }
    @keyframes p4 { 0%,26.88%     { opacity:0; } 26.89%,38.08%  { opacity:1; } 38.09%,65.99% { opacity:0; } 66.00%,69.60% { opacity:1; } 69.61%,100% { opacity:0; } }
    @keyframes p5 { 0%,38.08%     { opacity:0; } 38.09%,50.40%  { opacity:1; } 50.41%,62.39% { opacity:0; } 62.40%,66.00% { opacity:1; } 66.01%,100% { opacity:0; } }
    @keyframes shell { 0%,50.40% { opacity:0; } 50.41%,62.40% { opacity:1; } 62.41%,100% { opacity:0; } }

    /* sécurité : n'apparaît qu'au début de l'effacement de la ligne */
    @keyframes b1 { 0%,76.80% { opacity:0; } 77.23%,100% { opacity:1; } }
    @keyframes b2 { 0%,73.20% { opacity:0; } 73.63%,100% { opacity:1; } }
    @keyframes b3 { 0%,69.60% { opacity:0; } 70.03%,100% { opacity:1; } }
    @keyframes b4 { 0%,66.00% { opacity:0; } 66.43%,100% { opacity:1; } }
    @keyframes b5 { 0%,62.40% { opacity:0; } 62.83%,100% { opacity:1; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>

  <!-- Fenêtre du terminal -->
  <rect x="0.5" y="0.5" width="759" height="249" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="758" height="38" rx="11" fill="#161b22"/>
  <rect x="1" y="20" width="758" height="19" fill="#161b22"/>
  <circle cx="24" cy="20" r="6.5" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6.5" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6.5" fill="#27c93f"/>
  <text class="mono" x="380" y="25" font-size="13" fill="#8b949e" text-anchor="middle">laman0@github: ~/mmi</text>

  <!-- Ligne 1 : prompt "$ " (toujours affiché, hors du masque) + commande whoami -->
  <text class="mono" x="30" y="72" font-size="15"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> Me</tspan></text>
  <rect class="cover c1" x="47" y="56" width="56" height="22"/>

  <!-- Ligne 2 : réponse -->
  <text class="mono" x="30" y="102" font-size="15" fill="#e6edf3">Étudiant en <tspan fill="#7ee787" font-weight="600">MMI</tspan> — Métiers du Multimédia &amp; de l'Internet</text>
  <rect class="cover c2" x="28" y="86" width="488" height="22"/>

  <!-- Ligne 3 : commande ls competences/ -->
  <text class="mono" x="30" y="132" font-size="15"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> Competences/</tspan></text>
  <rect class="cover c3" x="28" y="116" width="154" height="22"/>

  <!-- Ligne 4 : compétences (partie 1) -->
  <text class="mono" x="30" y="162" font-size="15"><tspan fill="#79c0ff">&gt;</tspan><tspan fill="#e6edf3"> développement web</tspan><tspan dx="26" fill="#7ee787">&gt;</tspan><tspan fill="#e6edf3"> design &amp; UX</tspan><tspan dx="26" fill="#d2a8ff">&gt;</tspan><tspan fill="#e6edf3"> audiovisuel</tspan></text>
  <rect class="cover c4" x="28" y="146" width="452" height="22"/>

  <!-- Ligne 5 : compétences (partie 2) -->
  <text class="mono" x="30" y="192" font-size="15"><tspan fill="#ffa657">&gt;</tspan><tspan fill="#e6edf3"> communication digitale</tspan><tspan dx="26" fill="#ff7b72">&gt;</tspan><tspan fill="#e6edf3"> montage vidéo</tspan><tspan dx="26" fill="#56d364">&gt;</tspan><tspan fill="#e6edf3"> création numérique</tspan></text>
  <rect class="cover c5" x="28" y="176" width="593" height="22"/>

  <!-- Sécurité de fin de ligne (opaque uniquement pendant l'effacement de la ligne) -->
  <rect class="tail t1" x="103" y="56" width="40" height="22"/>
  <rect class="tail t2" x="516" y="86" width="40" height="22"/>
  <rect class="tail t3" x="182" y="116" width="40" height="22"/>
  <rect class="tail t4" x="480" y="146" width="40" height="22"/>
  <rect class="tail t5" x="621" y="176" width="40" height="22"/>

  <!-- Curseurs de ligne : posés sur le bord de leur masque, donc à la fin du texte visible -->
  <rect class="cur k1" x="47" y="57" width="9.5" height="17"/>
  <rect class="cur k2" x="28" y="87" width="9.5" height="17"/>
  <rect class="cur k3" x="28" y="117" width="9.5" height="17"/>
  <rect class="cur k4" x="28" y="147" width="9.5" height="17"/>
  <rect class="cur k5" x="28" y="177" width="9.5" height="17"/>

  <!-- Prompt du bas : uniquement quand tout est affiché -->
  <g class="shell">
    <text class="mono" x="30" y="226" font-size="15" fill="#7ee787">$</text>
    <rect class="cursor" x="47" y="211" width="9.5" height="17" fill="#7ee787"/>
  </g>
</svg>
